services:
  - type: web
    name: anugya-satyapak-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ANUGYA_SATYAPAK_ALLOWED_ORIGINS
        value: https://0blisake.github.io,http://localhost:5173,http://127.0.0.1:5173
      - key: PYTHONUNBUFFERED
        value: "1"
